ing:10px"></div><div style="position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;border-top:1px solid #ccc;display:flex;justify-content:space-between"><span>Cart: <b id="count">0</b> | Rs <b id="total">0</b></span><button onclick="order()" style="background:green;color:white;padding:8px 15px;border-radius:20px;font-weight:bold">WhatsApp Order</button></div><script>let all=[["Mom Panjeeri 1kg",1800,"mom"],["Biryani Family",650,"fastfood"],["Zinger Burger",550,"fastfood"],["Baby Pampers 40",1850,"baby"],["Baby Suit",950,"baby"],["Gents Shalwar",2500,"garments"],["Ladies Lawn Suit",2850,"garments"],["Grocery Pack",1200,"grocery"],["Oil 1L",680,"grocery"],["Dinner Set",8500,"crockery"],["Tea Set",2200,"crockery"],["Earbuds",1450,"electronics"],["LED TV 32",28500,"electronics"],["Charger",850,"mobile"],["Mobile Battery",1250,"mobile"],["Bike Parts",550,"mobile"]];let cart=[],cur="all";function show(){let d=document.getElementById('products');d.innerHTML="";all.filter(p=>cur=="all"||p[2]==cur).forEach(p=>{d.innerHTML+=`<div style="background:white;border-radius:10px;padding:10px;box-shadow:0 1px 3px #ccc"><h4 style="font-weight:bold;font-size:12px">${p[0]}</h4><p>Rs ${p[1]}</p><button onclick="add('${p[0]}',${p[1]})" style="margin-top:5px;background:orange;color:white;width:100%;padding:5px;border-radius:20px;font-size:12px">Add +</button></div>`});}function add(n,p){let f=cart.find(x=>x[0]==n);if(f)f[2]++;else cart.push([n,p,1]);upd();}function upd(){let c=0,t=0;cart.forEach(x=>{c+=x[2];t+=x[1]*x[2]});document.getElementById('count').innerText=c;document.getElementById('total').innerText=t;}function filterCat(c){cur=c;show();}function order(){if(!cart.length)return alert('Cart khali hai');let txt=`NEW ORDER%0A${cart.map(x=>x[0]+' x'+x[2]+' = Rs '+(x[1]*x[2])).join('%0A')}%0ATotal Rs ${cart.reduce((a,b)=>a+b[1]*b[2],0)}`;window.open('https://wa.me/923002642179?text='+txt,'_blank');}show();</script></body></html>
